<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Logo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f9ff;
            font-family: Arial, sans-serif;
        }
        
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .logo-large {
            width: 200px;
            height: 200px;
            background-color: #14b8a6; /* teal-500 */
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .logo-svg {
            width: 120px;
            height: 120px;
        }
        
        .logo-title {
            font-size: 24px;
            font-weight: bold;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo-large">
            <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-svg">
                <path d="M8 14h.01"></path>
                <path d="M12 14h.01"></path>
                <path d="M16 14h.01"></path>
                <path d="M18 18h-5a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h5v7z"></path>
                <path d="M11 2a2 2 0 0 1 2 2v2h-4V4a2 2 0 0 1 2-2z"></path>
                <path d="M14 2v4"></path>
                <path d="M10 2v4"></path>
                <path d="M19 18v2a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-2"></path>
                <path d="M10 11V9"></path>
            </svg>
        </div>
        <div class="logo-title">Virtual Clinic</div>
    </div>
</body>
</html>
